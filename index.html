<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Just Click in Circle</title>

    <link rel="stylesheet" href="main/style.css">
    <script src="main/script.js" defer></script>
</head>
<body>

<!-- ===== Side Panel Module =====
     Total Click이 10 이상이 되면 나타나는 왼쪽 탭 메뉴.
     data-tab 값은 아래 메인 탭 섹션의 id와 반드시 일치해야 함. -->
<aside id="sidePanel" class="side-panel">

    <nav class="side-tab-list">

        <button class="side-tab active" data-tab="clickMain">
            <span>Click</span>
            <span class="tab-current">C</span>
        </button>

        <button class="side-tab" data-tab="upgradeMain">
            <span>Click Upgrades</span>
            <span class="tab-current"></span>
        </button>

        <button class="side-tab" data-tab="optionMain">
            <span>Options</span>
            <span class="tab-current"></span>
        </button>

    </nav>

</aside>


<!-- ===== Main Tab Content Module =====
     각 섹션이 하나의 탭 화면.
     .active 클래스가 붙은 섹션만 표시되고, 내용물은 화면 중앙에 정렬됨. -->

<!-- [Click 탭] 기본 클릭 버튼 + Total Click / CPS 표시 -->
<section id="clickMain" class="main-tab-content active">

    <!-- 클릭 버튼 -->
    <button id="clickButton">Click!</button>

    <!-- Total Click 표시 -->
    <div id="clickDisplay">
        <span id="clickLabel">Total Click</span>
        <span id="clickCount">0</span>
    </div>

    <!-- CPS(초당 클릭 수) 표시 -->
    <div id="clickPerSecDisplay">
        <span id="clickPerSecLabel">CPS</span>
        <span id="clickPerSec">0</span>
    </div>

</section>

<!-- [Click Upgrades 탭] 내용은 나중에 추가 -->
<section id="upgradeMain" class="main-tab-content">
</section>

<!-- [Options 탭] 옵션 버튼 모음 -->
<section id="optionMain" class="main-tab-content">

    <div class="option-buttons">

        <!-- EXP: 현재 데이터를 JSON 문자열로 내보내기 (아래 입력창에 표시 + 클립보드 복사) -->
        <button id="exportButton" class="option-button" title="Export data as JSON">EXPORT</button>

        <!-- IMP: 아래 입력창의 JSON 문자열을 불러와서 적용 -->
        <button id="importButton" class="option-button" title="Import data from JSON">IMPORT</button>

        <!-- SAVE: 즉시 저장 (자동 저장 타이머도 새로 시작) -->
        <button id="saveButton" class="option-button" title="Save now">SAVE</button>

        <!-- Export 결과 표시 / Import 할 문자열 붙여넣기 -->
        <textarea id="dataTextarea" class="option-textarea" spellcheck="false"
                  placeholder="Paste JSON here, then press IMP"></textarea>

        <!-- 동작 결과 메시지 (Saved, Imported 등) -->
        <div id="optionMessage" class="option-message"></div>

    </div>

</section>

</body>
</html>
